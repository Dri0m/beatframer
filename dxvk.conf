# BeatFramer DXVK tuning for Steam Frame (Snapdragon 8 Gen 3 / Adreno 750 / Mesa Turnip)
# Placed inside the 1.44.1-BeatFramer instance root next to Beat Saber.exe.

# Reduce CPU-to-GPU frame queuing latency for VR frame pacing
d3d11.maxFrameLatency = 1

# Reduce barrier & shader overhead on mobile tile-based GPU (Turnip)
d3d11.relaxedBarriers = True
d3d11.constantBufferRangeCheck = False
d3d11.invariantPosition = False

# Use VK_EXT_graphics_pipeline_library to avoid mid-song shader compile stutters
dxvk.enableGraphicsPipelineLibrary = True
